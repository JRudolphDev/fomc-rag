[project]
name = "fomc-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jaryd Rudolph", email = "jarydrudolph@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.15.0",
    "pydantic==2.14.1",
    "requests==2.34.2",
]

[project.scripts]
fomc-rag = "fomc_rag:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
